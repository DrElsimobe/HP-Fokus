const prePrepDefaults=defaultProgress;defaultProgress=function(){return {...prePrepDefaults(),preparation:{mode:'month',day:0,done:{},reflection:{}},learning:{read:{},answers:{}}}};
const prePrepLoad=loadProgress;loadProgress=function(data){prePrepLoad(data);prepExtras()};
const prePrepRender=render;render=function(){prepExtras();prePrepRender();if(page==='prep')$('#crumb').textContent='Förberedelseläge';if(page==='article')$('#crumb').textContent='Genomgång · '+lessons[lesson][0]};
function daysUntilExam(){if(!/^\d{4}-\d{2}-\d{2}$/.test(state.exam||''))return null;const [y,m,d]=state.exam.split('-').map(Number),now=new Date();return Math.round((Date.UTC(y,m-1,d)-Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()))/86400000)}
function selectPrep(mode){prepExtras();state.preparation.mode=mode;const remaining=daysUntilExam(),span=prepPlans[mode].span;state.preparation.day=remaining!==null&&remaining>=1&&remaining<=span?span-remaining:0;save();go('prep')}
function movePrepDay(index){state.preparation.day=Math.min(prepPlans[state.preparation.mode].days.length-1,Math.max(0,Number(index)||0));save();render();document.querySelector('#prep-day-panel')?.scrollIntoView?.({behavior:'smooth',block:'start'})}
function prepTaskKey(mode,dayIndex,index){return mode+'-'+dayIndex+'-'+index}
function prepCounts(mode){const plan=prepPlans[mode];let done=0,total=0;plan.days.forEach((d,i)=>d.tasks.forEach((t,j)=>{total++;if(state.preparation.done[prepTaskKey(mode,i,j)])done++}));return {done,total}}
function runPrepTask(index){const {mode,day}=state.preparation,t=prepPlans[mode].days[day].tasks[index];if(!t)return;switch(t.kind){case 'lesson':openLesson(t.value);break;case 'practice':start(t.value.subject,t.value.count);break;case 'review':go('review');break;case 'notebook':case 'note':go('notebook');break;case 'words':go('words');break;case 'lessons':go('lessons');break;case 'checklist':go('tools');break;case 'official':go('library');break;case 'practical':window.open('https://www.studera.nu/hogskoleprov/provdag/praktiskt/','_blank','noopener');break;default:toast('Markera uppgiften när du känner dig klar.')}}
function savePrepDate(){state.exam=$('#prep-exam-date').value;save();render();toast('Ditt valda provdatum är sparat.')}
function togglePrepTask(index,checked){const p=state.preparation;p.done[prepTaskKey(p.mode,p.day,index)]=checked;save();render()}
views.prep=()=>{prepExtras();const p=state.preparation,plan=prepPlans[p.mode],d=plan.days[p.day],counts=prepCounts(p.mode),remaining=daysUntilExam(),todayDone=d.tasks.filter((_,j)=>p.done[prepTaskKey(p.mode,p.day,j)]).length;return heading('DIN SISTA STRÄCKA','Rätt fokus, vid rätt tid.','Tre förberedelselägen. Välj det som passar tiden du har kvar.')+`<div class="prep-mode-grid">${Object.entries(prepPlans).map(([id,pl])=>`<button class="prep-mode ${p.mode===id?'selected':''}" aria-pressed="${p.mode===id}" onclick="selectPrep('${id}')"><span class="prep-mode-number">${pl.span===1?'01':pl.span===7?'07':'30'}</span><span><strong>${pl.label}</strong><small>${id==='day'?'Lugn repetition & packning':id==='week'?'Prioritering & provvana':'Grund, tillämpning & helhet'}</small></span><span aria-hidden="true">${p.mode===id?'✓':'→'}</span></button>`).join('')}</div><div class="prep-hero"><div><span class="eyebrow">${plan.kicker}</span><h2>${plan.label}: ${p.mode==='day'?'landa inför imorgon':p.mode==='week'?'gör det viktiga tydligt':'bygg en hållbar rytm'}</h2><p>${plan.description}</p><p class="prep-principle">${plan.principle}</p></div><div class="prep-progress"><strong>${counts.done}<span> / ${counts.total}</span></strong><small>uppgifter markerade klara</small><progress value="${counts.done}" max="${counts.total}"></progress><span>${remaining===null?'Välj ett provdatum nedan':remaining>0?remaining+' dagar till ditt valda datum':remaining===0?'Ditt valda provdatum är idag':'Ditt valda provdatum har passerat'}</span></div></div><div class="prep-date card"><div><strong>Utgå från ditt provdatum</strong><small>När du sparar datumet eller väljer läge visas motsvarande plandag om datumet ligger inom planen. Du kan också bläddra själv.</small></div><div><label class="sr-label" for="prep-exam-date">Mitt provdatum</label><input id="prep-exam-date" type="date" value="${esc(state.exam)}"><button class="secondary" onclick="savePrepDate()">Spara datum</button></div></div><div class="prep-workspace space"><aside class="prep-agenda"><div class="sectionhead"><h2>${p.mode==='day'?'Dagens plan':'Din färdplan'}</h2><span class="tag">${plan.days.length} ${plan.days.length===1?'dag':'dagar'}</span></div>${plan.days.map((item,i)=>{const n=item.tasks.filter((_,j)=>p.done[prepTaskKey(p.mode,i,j)]).length;return `<button class="agenda-day ${p.day===i?'selected':''}" onclick="movePrepDay(${i})" aria-current="${p.day===i?'step':'false'}"><span class="agenda-number">${n===item.tasks.length?'✓':i+1}</span><span><small>${p.mode==='day'?'DAGEN FÖRE':p.mode==='week'?7-i+' DAGAR KVAR':'DAG '+(i+1)}</small><strong>${item.title}</strong></span><span>${n}/${item.tasks.length}</span></button>`}).join('')}</aside><section id="prep-day-panel"><div class="sectionhead"><div><span class="eyebrow">${d.phase}</span><h2 class="space" style="margin-top:9px">${d.title}</h2></div><span class="tag">${todayDone}/${d.tasks.length} klara</span></div><p class="prep-estimate">Förslag: cirka ${d.tasks.reduce((sum,t)=>sum+t.minutes,0)} minuter totalt. Pauser tillkommer. Dela upp eller korta ner efter din tid och ork.</p><div class="prep-tasks">${d.tasks.map((t,j)=>{const done=p.done[prepTaskKey(p.mode,p.day,j)];return `<div class="card prep-task ${done?'done':''}"><div class="prep-task-top"><label class="task-check"><input type="checkbox" ${done?'checked':''} onchange="togglePrepTask(${j},this.checked)"><span class="sr-label">Markera ${esc(t.title)} klar</span></label><div><h3>${t.title}</h3><p>${t.detail}</p></div><span class="task-time">${t.minutes?t.minutes+' min':'I din takt'}</span></div><div class="prep-task-bottom"><span>${t.kind==='official'?'Officiellt material utanför appen':t.kind==='manual'?'Egen förberedelse':'Du markerar själv när du är klar'}</span><button class="${done?'secondary':'primary'}" onclick="runPrepTask(${j})">${t.kind==='manual'?'Visa påminnelse':t.kind==='practical'?'Öppna UHR ↗':'Öppna uppgiften →'}</button></div></div>`}).join('')}</div><div class="card space"><label for="prep-reflection">${p.mode==='day'?'Min enkla påminnelse till imorgon':'Dagens insikt & nästa steg'}</label><textarea id="prep-reflection" rows="3" maxlength="2000" placeholder="Det här vill jag ta med mig…" onchange="state.preparation.reflection['${p.mode}-${p.day}']=this.value.slice(0,2000);save()">${esc(p.reflection[p.mode+'-'+p.day]||'')}</textarea><small>Texten sparas när du lämnar fältet.</small></div><div class="actions"><button class="secondary" onclick="movePrepDay(${p.day-1})" ${p.day===0?'disabled':''}>← Föregående dag</button><button class="primary" onclick="movePrepDay(${p.day+1})" ${p.day===plan.days.length-1?'disabled':''}>Nästa dag →</button></div></section></div><div class="card note space"><h3>En riktning, ingen resultatgaranti</h3><p>Planerna är appens egna studieförslag. Uppgifter markerade klara betyder inte att metoden är behärskad. Officiella prov och din kallelse gäller för format och regler.</p><a href="https://www.studera.nu/hogskoleprov/om/forbereda/tidigare/" target="_blank" rel="noopener">UHR:s gamla prov och facit ↗</a> · <a href="https://www.studera.nu/hogskoleprov/provdag/praktiskt/" target="_blank" rel="noopener">Praktiskt inför provdagen ↗</a></div>`};
function learningStats(index){const checks=lessonGuides[index].checks;return {answered:checks.filter((_,j)=>state.learning.answers[index+'-'+j]!==undefined).length,correct:checks.filter((q,j)=>state.learning.answers[index+'-'+j]?.choice===q[2]).length,total:checks.length}}
function chooseLessonAnswer(index,check,choice){const q=lessonGuides[index]?.checks[check];if(!q||choice<0||choice>=q[1].length||state.learning.answers[index+'-'+check]!==undefined)return;state.learning.answers[index+'-'+check]={choice,at:Date.now()};save();const top=window.scrollY;render();window.scrollTo(0,top)}
function retryLessonCheck(index,check){delete state.learning.answers[index+'-'+check];save();const top=window.scrollY;render();window.scrollTo(0,top)}
function markLessonRead(index){state.learning.read[index]=!state.learning.read[index];save();render();toast(state.learning.read[index]?'Markerad som genomläst. Återkom gärna till kontrollfrågorna.':'Markeringen är borttagen.')}
function saveLessonNote(index){const body=$('#lesson-insight').value.trim();if(!body){toast('Skriv din lärdom först.');return}studyExtras();const id='lesson-'+index;state.notebook=state.notebook.filter(n=>n.id!==id);state.notebook.unshift({id,title:lessons[index][1],subject:lessons[index][0],body:body.slice(0,8000),updated:Date.now()});save();toast('Din lärdom finns i anteckningsboken.')}
function miniVisual(index){if(index===6)return `<figure class="lesson-data"><figcaption>Resenärer i exemplet · samma skala för alla staplar</figcaption>${[['A',120],['B',180],['C',300]].map(([name,n])=>`<div class="data-bar"><b>${name}</b><div><i style="width:${n/3}%"></i></div><span>${n}</span></div>`).join('')}<p>Totalt 600. B står för 180/600 = 30 %.</p></figure>`;if(index===3)return `<figure class="lesson-geometry"><svg viewBox="0 0 320 180" role="img" aria-label="Rätvinklig triangel med kateter 9 och 12 och hypotenusa 15"><path d="M65 20 L65 150 L260 150 Z" fill="var(--pale)" stroke="var(--green)" stroke-width="3"/><path d="M65 132 L83 132 L83 150" fill="none" stroke="var(--green)" stroke-width="2"/><text x="35" y="90">9</text><text x="155" y="173">12</text><text x="171" y="74">15</text></svg><figcaption>Diagonalen blir hypotenusa. Figuren är schematisk.</figcaption></figure>`;return ''}
views.lessons=()=>{prepExtras();const read=lessons.filter((_,i)=>state.learning.read[i]).length;return heading('FRÅN METOD TILL FÖRSTÅELSE','Förstå först. Träna sedan.','13 fördjupade genomgångar med lösta exempel och 26 interaktiva kontrollfrågor.')+`<div class="lesson-overview card"><div><strong>${read} / ${lessons.length}</strong><small>markerade som genomlästa</small></div><progress value="${read}" max="${lessons.length}"></progress><button class="secondary" onclick="go('prep')">Till mitt förberedelseläge →</button></div><div class="pillrow">${['Alla',...Object.keys(subjects)].map(s=>`<button class="${filter===s?'selected':''}" onclick="filter='${s}';render()">${s}</button>`).join('')}</div><div class="grid">${lessons.map((l,i)=>{const stats=learningStats(i);return filter==='Alla'||filter===l[0]?`<button class="card lesson lesson-card" onclick="openLesson(${i})"><div class="sectionhead"><span class="tag">${l[0]}</span><span class="number">${state.learning.read[i]?'✓ Genomläst':'6–10 min'}</span></div><h2>${l[1]}</h2><p>${lessonGuides[i].goal}</p><div class="lesson-card-bottom"><span>Metod · 2 exempel · 2 frågor</span><span>${stats.answered}/${stats.total} besvarade →</span></div></button>`:''}).join('')}</div>`};
views.article=()=>{prepExtras();const l=lessons[lesson],guide=lessonGuides[lesson],stats=learningStats(lesson),note=state.notebook?.find(n=>n.id==='lesson-'+lesson);return `<div class="lesson-reader"><div class="lesson-reader-top"><button class="quiet" onclick="go('lessons')">← Alla genomgångar</button><button class="quiet" onclick="go('prep')">Mitt förberedelseläge ↗</button></div>${heading(l[0]+' · FÖRDJUPNING',l[1],guide.goal)}<div class="lesson-jump"><a href="#lesson-method">Metoden</a><a href="#lesson-example">Exemplet</a><a href="#lesson-checks">Testa dig</a><a href="#lesson-insight">Min lärdom</a></div><section class="card lesson-section" id="lesson-method"><div class="lesson-section-label">01 / FÖRSTÅ</div><h2>Varför metoden fungerar</h2><p>${l[3]}</p><ol class="method-steps">${guide.steps.map((s,i)=>`<li><span>${i+1}</span><p>${s}</p></li>`).join('')}</ol></section><section class="card lesson-section" id="lesson-example"><div class="lesson-section-label">02 / FÖLJ TANKEN</div><h2>Två exempel, från idé till kontroll</h2><div class="worked-example"><span class="tag">EXEMPEL 1 · GRUNDIDÉN</span><p>${l[4]}</p></div><div class="worked-example"><span class="tag">EXEMPEL 2 · ETT STEG VIDARE</span><h3>${guide.example[0]}</h3><ol>${guide.example[1].map(s=>`<li>${s}</li>`).join('')}</ol>${miniVisual(lesson)}</div><div class="lesson-pitfall"><strong>Här är det lätt att gå fel</strong><p>${l[5]}</p><p>${guide.trap}</p></div>${lesson===5?`<details><summary>NOG: så skiljer du de fem fallen åt</summary><table><thead><tr><th>Vad räcker?</th><th>Välj beskrivningen</th></tr></thead><tbody><tr><td>Bara (1)</td><td>Enbart (1)</td></tr><tr><td>Bara (2)</td><td>Enbart (2)</td></tr><tr><td>Ingen ensam, men båda ihop</td><td>Tillsammans, inte var för sig</td></tr><tr><td>Både (1) och (2) ensamma</td><td>Var och en för sig</td></tr><tr><td>Inte ens kombinationen</td><td>Inte ens tillsammans</td></tr></tbody></table><p>Läs alltid de faktiska svarsalternativen i uppgiften.</p></details>`:''}</section><section class="card lesson-section" id="lesson-checks"><div class="lesson-section-label">03 / ÅTERKALLA SJÄLV</div><div class="sectionhead"><h2>Kan du använda metoden?</h2><span class="tag">${stats.correct}/${stats.total} rätt just nu</span></div><p>Försök utan att läsa exemplen igen. Du får återkoppling direkt. Kontrollfrågorna ingår inte i din vanliga frågestatistik.</p>${guide.checks.map((q,j)=>{const answer=state.learning.answers[lesson+'-'+j];return `<div class="lesson-check"><h3>${j+1}. ${q[0]}</h3><div class="options">${q[1].map((option,k)=>`<button class="option ${answer&&k===q[2]?'correct':''} ${answer?.choice===k&&k!==q[2]?'wrong':''}" onclick="chooseLessonAnswer(${lesson},${j},${k})" ${answer?'disabled':''}><b>${String.fromCharCode(65+k)}</b>${esc(option)}</button>`).join('')}</div>${answer?`<div class="lesson-answer" role="status"><strong>${answer.choice===q[2]?'✓ Rätt – så här kan du tänka':'Ett bra tillfälle att justera metoden'}</strong><p>${q[3]}</p><button class="quiet" onclick="retryLessonCheck(${lesson},${j})">Försök igen utan markerat svar ↻</button></div>`:''}</div>`}).join('')}<details><summary>En extra kontrollfråga utan alternativ</summary><p>${l[6]}</p><details><summary>Visa lösningsförslaget</summary><p>${l[7]}</p></details></details></section><section class="card lesson-section"><div class="lesson-section-label">04 / GÖR KUNSKAPEN TILL DIN</div><h2>En mening att ta med dig</h2><label for="lesson-insight">Hur skulle du förklara metoden för någon annan?</label><textarea id="lesson-insight" rows="4" maxlength="8000" placeholder="Jag börjar med… Sedan kontrollerar jag…">${esc(note?.body||'')}</textarea><div class="actions"><button class="secondary" onclick="saveLessonNote(${lesson})">Spara i anteckningsboken</button><button class="primary" onclick="start('${l[0]}',8)">Öva ${l[0]} →</button></div><div class="lesson-read-toggle"><button class="quiet" onclick="markLessonRead(${lesson})">${state.learning.read[lesson]?'✓ Markerad genomläst – ta bort markering':'○ Markera som genomläst'}</button><small>En läsmarkering är din egen notering, inte ett kunskapstest.</small></div></section><div class="actions lesson-navigation"><button class="secondary" onclick="openLesson(${lesson-1})" ${lesson===0?'disabled':''}>← Föregående</button><button class="primary" onclick="openLesson(${lesson+1})" ${lesson===lessons.length-1?'disabled':''}>Nästa genomgång →</button></div></div>`};
const beforePrepHome=views.home;views.home=()=>{prepExtras();const p=state.preparation,plan=prepPlans[p.mode],counts=prepCounts(p.mode),remaining=daysUntilExam();return `<section class="home-prep-banner"><div><span class="eyebrow">DITT FÖRBEREDELSELÄGE</span><h2>${plan.label}${remaining!==null&&remaining>0?' · '+remaining+' dagar till ditt datum':''}</h2><p>${plan.days[p.day].title} · ${counts.done}/${counts.total} uppgifter klara</p></div><button class="primary" onclick="go('prep')">Öppna min färdplan →</button></section>`+beforePrepHome()};
const beforePrepPlan=views.plan;views.plan=()=>`<div class="card space"><div class="sectionhead"><div><span class="eyebrow">NÄRA PROVDAGEN?</span><h2 class="space" style="margin-top:9px">Välj planen för tiden du har.</h2></div><button class="primary" onclick="go('prep')">Dagen · veckan · månaden före →</button></div></div>`+beforePrepPlan();
prepExtras();render();
</script></body></html>

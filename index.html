const texts=[['När en kommun planterade träd längs en trafikerad gata sjönk temperaturen där under varma sommardagar. Forskarna påpekade dock att mätningarna endast omfattade ett kvarter. För att bedöma effekten i hela staden behövs studier i fler miljöer.','Vilken slutsats stöds av texten?',['Träd kyler alltid hela staden lika mycket.','Resultatet är lovande men begränsat.','Mätningar av temperatur saknar värde.','Trafiken minskade när träden planterades.'],1,'Texten redovisar en lokal temperatursänkning men betonar mätningarnas begränsning. Den säger inget om minskad trafik.'],['Biblioteket förlängde sina öppettider och antalet besök ökade. Samtidigt hade ett nytt bostadsområde byggts i närheten. Att tillskriva hela ökningen de längre öppettiderna vore därför förhastat.','Vad är textens huvudpoäng?',['Bibliotek bör minska sina öppettider.','Bostäder förhindrar läsning.','Flera faktorer kan förklara ökningen.','Längre öppettider saknar effekt.'],2,'Författaren lyfter en alternativ förklaring. Samband i tid är inte tillräckligt för att fastställa en enda orsak.'],['Digitala arkiv gör äldre dokument lättare att nå. Men sökbara kopior ersätter inte alltid originalen: papprets struktur, marginalanteckningar och dokumentets ordning kan bära information som försvinner vid digitalisering.','Hur förhåller sig författaren till digitalisering?',['Enbart negativt.','Positivt, men med en reservation.','Helt likgiltigt.','Som en lösning som ersätter alla original.'],1,'Tillgängligheten är en fördel. Ordet ”men” introducerar begränsningen: vissa egenskaper hos originalet går förlorade.']];

[['Trots att underlaget var begränsat drog forskaren en _____ slutsats.','tvärsäker',['försiktig','tvärsäker','preliminär','tveksam'],'”Trots” markerar motsättning. Begränsat underlag står i kontrast till en tvärsäker slutsats.'],['Resultaten var inte _____; de varierade kraftigt mellan grupperna.','enhetliga',['enhetliga','olika','oväntade','mätbara'],'Det andra ledet förklarar det första: kraftig variation innebär att resultaten inte var enhetliga.'],['Förslaget fick brett stöd, _____ vissa detaljer fortfarande kritiserades.','även om',['eftersom','så att','även om','därför att'],'”Även om” uttrycker en reservation: stöd för helheten kan finnas trots kritik mot detaljer.'],['För att undvika missförstånd behövde hon _____ vad hon menade med begreppet.','precisera',['fördunkla','precisera','försumma','återkalla'],'Att precisera är att göra något tydligare och mer exakt. Det minskar risken för missförstånd.'],['Hans slutsats var _____ med resultaten och behövde därför omprövas.','oförenlig',['förenlig','oförenlig','liktydig','jämförbar'],'Att slutsatsen behöver omprövas signalerar att den inte stämmer med resultaten.']].forEach(([q,w,o,e])=>add('MEK',q,o,o.indexOf(w),e));
[['Working from home reduced commuting time in the study. However, participants reported very different experiences of concentration. The authors therefore cautioned against a single policy for every workplace.','What do the authors suggest?',['All offices should close.','One policy may not suit everyone.','Commuting improves concentration.','The study found no benefits.'],1,'The phrase “cautioned against a single policy” signals that different settings may require different solutions. The text does report reduced commuting time.'],['A museum replaced its lengthy labels with shorter descriptions. Visitors spent more time looking at the objects, though some said they missed the detailed historical background.','What trade-off is described?',['Lower costs versus fewer visitors.','More attention to objects versus less context.','New objects versus older objects.','More staff versus shorter hours.'],1,'Short labels directed attention to the exhibits, but removed some historical detail. “Though” introduces that disadvantage.'],['The new method is promising, but the evidence remains preliminary. Larger trials are needed before firm conclusions can be drawn.','What does “preliminary” mean here?',['Final','Early and not yet conclusive','Incorrect','Unrelated'],1,'“Larger trials are needed” shows that the evidence is at an early stage. Preliminary does not mean false.']].forEach(([text,q,o,a,e])=>add('ELF',q,o,a,e,{text}));
const lessons=[
['XYZ','Procent som faktiskt fastnar','Tänk i förändringsfaktorer, inte bara procenttal.','Procent betyder hundradelar. En ökning med 15 % ger faktorn 1,15. En minskning med 15 % ger 0,85. Multiplikation fungerar eftersom det nya värdet består av hela ursprunget plus eller minus förändringen.','En jacka för 800 kr sänks med 25 %: 800 × 0,75 = 600 kr. Om priset sedan höjs med 25 % blir det 600 × 1,25 = 750 kr.','Att tro att lika stor procentuell sänkning och höjning tar ut varandra. Procenten beräknas på olika utgångsvärden.','En vara kostar 500 kr och höjs med 12 %. Nytt pris?','500 × 1,12 = 560 kr.'],
['XYZ','Ekvationer utan gissningar','Håll balansen i båda leden.','En ekvation är en likhet. Gör samma operation på båda sidor så bevaras likheten. Samla x-termer på ena sidan och rena tal på den andra.','3x + 7 = 22 → 3x = 15 → x = 5. Kontroll: 3 × 5 + 7 = 22.','Att byta tecken utan att förstå operationen. Skriv mellanled tills metoden sitter.','Lös 4x − 6 = 18.','Addera 6: 4x = 24. Dividera med 4: x = 6.'],
['XYZ','Bråk, kvoter och rimlighet','Delat med är också ett sätt att jämföra.','Bråk beskriver en del av en helhet. För addition krävs samma nämnare. För multiplikation multiplicerar du täljare för sig och nämnare för sig.','1/3 + 1/4 = 4/12 + 3/12 = 7/12. Däremot är 1/3 × 1/4 = 1/12.','Att addera nämnarna. Kontrollera storleken: 1/3 + 1/4 måste vara större än 1/3.','Beräkna 2/5 + 1/10.','4/10 + 1/10 = 5/10 = 1/2.'],
['XYZ','Geometri med en plan','Rita, märk ut och välj formel.','Rektangelns area är bas × höjd. Triangelns area är bas × höjd / 2 eftersom två likadana trianglar kan bilda en parallellogram. I en rätvinklig triangel gäller a² + b² = c², där c är hypotenusan.','En triangel med bas 8 cm och vinkelrät höjd 5 cm har arean 8 × 5 / 2 = 20 cm².','Att använda en sned sida som höjd. Höjden ska vara vinkelrät mot basen.','En rätvinklig triangel har kateterna 6 och 8. Hypotenusa?','√(6² + 8²) = √100 = 10.'],
['KVA','Jämför innan du räknar','Leta efter struktur och motexempel.','Du behöver bara avgöra relationen mellan två storheter. Förenkla samma termer på båda sidor. Om x inte är bestämt testar du positiva, negativa och nollvärden som uppfyller villkoren.','I: x². II: x. Om x = 2 är I större. Om x = 1/2 är II större. Utan fler villkor räcker informationen inte.','Att testa ett enda värde och tro att det bevisar en relation för alla värden.','x > 0. Jämför x + 3 och x + 2.','Första är större. Subtrahera x från båda: 3 > 2.'],
['NOG','Räcker informationen?','Bedöm entydighet, inte hur lätt det är att räkna.','Testa (1) ensam och glöm sedan den när du testar (2) ensam. Först om ingen räcker provar du båda tillsammans. Ett värde måste vara entydigt, eller en ja/nej-fråga ha ett entydigt svar.','Vad är x? (1) x² = 16 ger två möjligheter. (2) x > 0 ger många möjligheter. Tillsammans får vi x = 4.','Att råka använda information från (1) när du bedömer om (2) räcker ensam.','Vad är x? (1) x + 2 = 9. (2) 2x = 14.','Var och en räcker för sig: båda bestämmer x = 7.'],
['DTK','Läs diagram i rätt ordning','Rubrik → axlar → enhet → fråga.','Börja med vad figuren visar och vilken tidsperiod den gäller. Kontrollera axelns startpunkt och enheter. Läs sedan endast av de värden som frågan kräver. Andel är del / helhet; förändring är nytt − gammalt.','En ökning från 40 till 50 är 10 enheter men 10/40 = 25 %. Procenten beräknas på det gamla värdet.','Att blanda procent och procentenheter. Från 20 % till 25 % är +5 procentenheter men +25 procent.','En skala är 1:50 000. Hur långt är 3 cm på kartan?','3 × 50 000 cm = 150 000 cm = 1,5 km.'],
['ORD','Lär dig ord så att de stannar','Aktiv återkallning slår passiv omläsning.','Försök först förklara ordet utan att se svaret. Läs sedan betydelsen och skriv en egen mening. Repetera efter ett uppehåll. Gruppera gärna ord med liknande betydelse, men notera skillnader.','”Koncis” betyder kortfattad. ”En koncis rapport” ger kärnan med få ord. Motsatsen är ungefär utförlig.','Att bara känna igen hur ordet ser ut. Du behöver kunna koppla det till betydelsen utan ledtråd.','Vad betyder ambivalent?','Kluven: att känna motstridiga känslor eller tveka mellan alternativ.'],
['LÄS','Hitta textens bärande tanke','Skilj huvudtes från exempel.','Läs frågan noga och hitta stöd i texten. Markera mentalt ord som ”men”, ”däremot” och ”därför”: de visar hur argumenten hänger ihop. Ett rimligt påstående är inte automatiskt ett svar som texten stöder.','”Metoden sparar tid, men precisionen minskar.” Huvudpoängen är en avvägning, inte enbart att metoden är snabb.','Att välja ett extremt svar med ”alltid” när texten bara beskriver ett begränsat fall.','Vad signalerar ”däremot”?','En kontrast eller motsättning till det som kom före.'],
['MEK','Låt sambandsorden guida dig','Förutse betydelsen innan du läser alternativen.','Läs hela meningen och bestäm om den tomma platsen kräver en motsats, följd eller precisering. Formulera ett eget ungefärligt ord. Kontrollera sedan att hela alternativet fungerar både grammatiskt och logiskt.','”Trots motgångarna var hon ___.” Trots signalerar kontrast, så ”uthållig” är rimligare än ”uppgiven”.','Att välja ett ord som låter fint men vänder resonemangets betydelse.','”Han var trött; likväl fortsatte han.” Vad betyder likväl?','Ändå eller trots det. Det markerar att fortsättningen går emot förväntningen.'],
['ELF','Read for meaning','Follow the argument, not every unfamiliar word.','Identifiera textens ämne, syfte och hållning. Gissa okända ord med hjälp av sammanhanget när de inte är avgörande. Däremot ska ord som ”however”, ”although” och ”unless” läsas exakt: de ändrar relationen mellan idéer.','“The approach is efficient; however, it is expensive.” Författaren väger en fördel mot en nackdel.','Att översätta varje ord och tappa helheten, eller välja ett svar som går längre än texten.','Vad signalerar ”although”?','Fastän eller även om: en eftergift eller kontrast.'],
['XYZ','Medelvärde, median och sannolikhet','Välj rätt mått för rätt fråga.','Medelvärde är summa / antal. Median är mittenvärdet när talen är sorterade. Sannolikhet i en likformig modell är gynnsamma utfall / möjliga utfall.','Talen 2, 3, 10 har median 3 men medelvärde 5. Ett extremvärde påverkar medelvärdet mer.','Att ta mittenvärdet utan att först sortera talen.','Vad är sannolikheten att få ett jämnt tal med en vanlig sexsidig tärning?','3 gynnsamma utfall av 6: 3/6 = 1/2.'],
['LÄS','En provstrategi som håller','Fördela tiden och kom tillbaka.','Börja med uppgifter du kan lösa inom rimlig tid. Markera tidskrävande uppgifter och återvänd senare. I ett officiellt provpass har du 55 minuter för 40 uppgifter. Träna tempo med hela gamla pass för att vänja dig vid formatet.','Om en uppgift tar tre minuter utan framsteg: välj ditt bästa alternativ, markera den och gå vidare.','Att låta en enda svår uppgift äta upp tiden för flera möjliga poäng.','Hur ska du använda ett felaktigt svar efter träningen?','Identifiera om felet berodde på kunskap, läsning eller tid. Skriv en konkret åtgärd och försök igen senare.']
];
</script><script>add('XYZ','En rektangel är 12 cm lång och 5 cm bred. Vad är diagonalens längd?',['11 cm','13 cm','17 cm','60 cm'],1,'Diagonalen är hypotenusan i en rätvinklig triangel: d² = 12² + 5² = 169, så d = 13 cm. Kontroll: diagonalen är längre än längsta sidan.');
add('XYZ','Medelvärdet av fyra tal är 8. Tre av talen är 5, 7 och 10. Vilket är det fjärde?',['6','8','10','12'],2,'Summan måste vara 4 × 8 = 32. De kända talen summeras till 22. Det saknade talet är 32 − 22 = 10.');
add('KVA','x < 0\nKvantitet I: x²\nKvantitet II: x',['I är större','II är större','De är lika','Informationen räcker inte'],0,'Kvadraten av ett negativt tal är positiv, medan x är negativt. Därför är x² alltid större än x under villkoret.');
add('KVA','a och b är positiva tal.\nKvantitet I: a / b\nKvantitet II: b / a',['I är större','II är större','De är lika','Informationen räcker inte'],3,'Om a = 2 och b = 1 är I större. Om a = 1 och b = 2 är II större. Båda exemplen följer villkoren, så relationen kan inte avgöras.');
add('NOG','Vilket värde har det positiva heltalet n?\n(1) n är delbart med 3 och mindre än 10.\n(2) n är ett jämnt tal större än 4 och mindre än 8.',['Enbart (1)','Enbart (2)','Tillsammans, men inte var för sig','Var och en för sig','Inte ens tillsammans'],1,'(1) tillåter 3, 6 och 9, så den räcker inte. (2) tillåter endast heltalet 6, så den räcker ensam. Positivt heltal är ett viktigt villkor.');
add('NOG','Är rektangelns area större än 20 cm²?\n(1) Rektangelns sidor är 3 cm och 8 cm.\n(2) Rektangelns omkrets är 22 cm.',['Enbart (1)','Enbart (2)','Tillsammans, men inte var för sig','Var och en för sig','Inte ens tillsammans'],0,'(1) ger arean 24 cm² och därmed svaret ja. (2) ger a + b = 11: sidorna 1 och 10 ger area 10, medan 5 och 6 ger 30. Svaret kan alltså variera för (2).');
add('DTK','En tabell visar försäljning:\nButik A: 2024 = 80, 2025 = 100\nButik B: 2024 = 120, 2025 = 144\n\nVilken butik hade störst procentuell ökning?',['Butik A','Butik B','Båda hade samma ökning','Det går inte att avgöra'],0,'A ökade med 20/80 = 25 %. B ökade med 24/120 = 20 %. A hade större procentuell ökning trots att B ökade med fler enheter.');
add('DTK','En karta har skalan 1:25 000. Avståndet mellan två punkter är 4 cm på kartan. Hur långt är det i verkligheten?',['100 m','500 m','1 km','10 km'],2,'4 × 25 000 = 100 000 cm. Det är 1 000 m = 1 km. Skalan är en kvot mellan längder i samma enhet.');
add('ORD','Vad betyder ”förankra” i meningen ”Förslaget behöver förankras bland medarbetarna”?',['Göra hemligt','Skapa förståelse och stöd för','Fördröja utan skäl','Förkasta helt','Översätta ordagrant'],1,'Här betyder förankra att skapa stöd och förståelse hos dem som berörs. Ordet används bildligt; det handlar inte om ett fysiskt ankare.');
add('ORD','Vad betyder ”tvetydig”?',['Ovanligt tydlig','Möjlig att tolka på mer än ett sätt','Helt sannolik','Utan betydelse','Mycket kort'],1,'Tvetydig betyder att något kan tolkas på mer än ett sätt. Ett tvetydigt besked lämnar utrymme för olika förståelser.');
add('MEK','Studien fann ett samband mellan vanorna, men kunde inte _____ att den ena orsakade den andra.',['utesluta','fastställa','ifrågasätta','förbise'],1,'”Men” markerar begränsningen: ett observerat samband räcker inte för att fastställa ett orsakssamband. ”Utesluta” skulle ge en annan betydelse.');
add('MEK','Eftersom deltagarna valdes genom lottning blev urvalet mindre beroende av forskarnas egna _____.',['mätinstrument','preferenser','tidsintervall','resultat'],1,'Lottning minskar forskarnas möjlighet att välja deltagare utifrån egna preferenser. Sambandet i meningen styr ordvalet.');
add('LÄS','Varför nämner texten högläsning?',['För att visa att all läsning måste vara offentlig.','För att ge ett exempel på hur en metod kan skapa gemenskap.','För att hävda att enskild läsning saknar värde.','För att förklara varför böcker blivit kortare.'],1,'Högläsningen exemplifierar textens övergripande resonemang om sociala dimensioner av läsning. Texten avfärdar inte enskild läsning.',{text:'Läsning beskrivs ofta som en ensam syssla, men den kan också vara social. Vid gemensam högläsning får deltagarna möta samma berättelse och jämföra sina tolkningar. Detta ersätter inte den enskilda läsningen, men visar att en bok kan bli en utgångspunkt för samtal.'});
add('LÄS','Vilket påstående ligger närmast författarens resonemang?',['En förändring i statistiken behöver tolkas med hänsyn till hur den mäts.','All statistik som ändras är felaktig.','Ett nytt mått ger alltid lägre värden.','Det saknas sätt att mäta cykeltrafik.'],0,'Texten skiljer mellan verklig förändring och förändrad mätmetod. Den säger inte att statistiken är värdelös, utan att jämförelsen kräver försiktighet.',{text:'Kommunen rapporterade fler cykelresor än året innan. Samtidigt hade man satt upp räknare på ytterligare tre platser. Ökningen kan därför inte utan vidare tolkas som att varje tidigare mätpunkt fått mer trafik. För en rättvis jämförelse bör samma platser följas över tid.'});
add('ELF','What is the main purpose of the final sentence?',['To reject the entire study.','To explain why the finding should not be generalized too quickly.','To claim that sleep has no effect on memory.','To propose replacing all classroom teaching.'],1,'The final sentence limits the scope of the evidence: a small, specific sample may not represent a wider population.',{text:'Students who took a short rest after learning new words remembered more of them in a small experiment. The researchers described the result as encouraging. They noted, however, that all participants were university students, so further research was needed before applying the finding to other age groups.'});
add('ELF','What does “rather than” express in the passage?',['A comparison of two dates.','A preference for one approach over another.','A cause of rising prices.','A claim that both approaches are identical.'],1,'“Rather than” contrasts making repair easier with repeatedly encouraging people to buy new goods. The writer favors the former approach.',{text:'A durable product is useful only if people can keep using it. Designers should therefore make parts easy to replace rather than simply encouraging customers to purchase a new model. Repairability connects a long-lasting design with practical everyday use.'});
</script><script>function toggleMenu(){const open=document.body.classList.toggle("menu-open");const button=document.querySelector(".mobile-menu");if(button){button.setAttribute("aria-expanded",String(open));button.setAttribute("aria-label",open?"Stäng menyn":"Öppna menyn");}}function closeMenu(){document.body.classList.remove("menu-open");const button=document.querySelector(".mobile-menu");if(button){button.setAttribute("aria-expanded","false");button.setAttribute("aria-label","Öppna menyn");}}
const $=s=>document.querySelector(s);let key='hpfokus-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{}}catch{state={}}state={history:[],marks:[],notes:{},reviews:{},goal:20,target:'1.5',minutes:25,exam:'',theme:false,...state};let page='home',filter='Alla',session=state.session||null,flash=0,flipped=false,interval;const names={home:['⌂','Överblick'],practice:['▦','Öva delprov'],lessons:['▤','Genomgångar'],exam:['◷','Prov på tid'],review:['↻','Repetition'],words:['Aa','Ordkort'],stats:['▥','Min utveckling'],plan:['▧','Studieplan'],library:['↗','Gamla prov']};
function save(){state.session=session;try{localStorage.setItem(key,JSON.stringify(state))}catch{toast('Kunde inte spara. Kontrollera webbläsarens lagringsutrymme.')}}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3000)}function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function day(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}const today=()=>state.history.filter(h=>h.day===day());function rate(arr){return arr.length?Math.round(100*arr.filter(x=>x.ok).length/arr.length):0}function score(s){return state.history.filter(h=>questions.find(q=>q.id===h.id)?.s===s)}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function due(){return questions.filter(q=>state.reviews[q.id]&&state.reviews[q.id].due<=Date.now())}function heading(k,t,p){return `<div class="intro"><div><div class="eyebrow">${k}</div><h1>${t}</h1>${p?`<p style="margin:0">${p}</p>`:''}</div><span class="tag">Små steg. Stor skillnad.</span></div>`}function go(p){page=p;filter='Alla';render();window.scrollTo(0,0)}function subjectCard(s){let a=score(s);return `<button class="card subject" onclick="start('${s}')"><span class="icon">${s}</span><div><h3>${subjects[s][0]}</h3><p>${subjects[s][1]} · ${questions.filter(q=>q.s===s).length} frågor</p><div class="bar"><i style="width:${rate(a)}%"></i></div></div><span class="arrow">↗</span></button>`}function streak(){let n=0,d=new Date();if(!today().length)d.setDate(d.getDate()-1);while(state.history.some(h=>h.day===day(d))){n++;d.setDate(d.getDate()-1)}return n}function render(){closeMenu();document.body.classList.toggle('dark',state.theme);$('#nav').innerHTML=Object.entries(names).map(([p,[i,n]])=>`<button class="${p===page?'active':''}" onclick="go('${p}')"><span>${i}</span>${n}</button>`).join('');$('#crumb').textContent=names[page]?.[1]||'Inställningar';$('#app').innerHTML=views[page]();if(page==='quiz')tick();}const views={};
views.home=()=>{let n=today().length,remaining=Math.max(0,state.goal-n),weak=Object.keys(subjects).sort((a,b)=>rate(score(a))-rate(score(b)))[0];return heading('EN BRA DAG ATT BÖRJA','Lite bättre, varje dag.','Din väg till högskoleprovet börjar här. Vi tar ett steg i taget.')+`<section class="hero"><div><div class="eyebrow">DITT NÄSTA STEG</div><h2>${n?'Fortsätt i din egen takt.':'Gör plats för ditt nästa mål.'}</h2><p>Ett kort pass, en ny insikt. Dagens blandade träning hjälper dig att upptäcka vad du kan och vad du ska öva mer på.</p><button class="primary" onclick="${session?"resume()":"start('Alla',10)"}">${session?'Fortsätt sparat pass':'Starta dagens pass'} &nbsp; →</button><span style="font-size:11px;margin-left:14px;color:#c3d5bc">10 frågor · alla delprov</span></div><div class="orb"><strong>${Math.min(100,Math.round(n/state.goal*100))}%</strong><small>av dagens mål</small></div></section><div class="stats"><div class="stat"><small>◎ Dagens frågor</small><strong>${n}<span style="font-size:15px;color:var(--muted)"> / ${state.goal}</span></strong><em>${remaining?remaining+' kvar till dagens mål':'Dagens mål är uppnått!'}</em></div><div class="stat"><small>✓ Träffsäkerhet</small><strong>${state.history.length?rate(state.history)+' %':'—'}</strong><em>${state.history.length?'av besvarade frågor':'Ditt första pass ger en startpunkt'}</em></div><div class="stat"><small>♧ Studiedagar i rad</small><strong>${streak()} <span style="font-size:15px">dagar</span></strong><em>Bygg en vana som håller</em></div><div class="stat"><small>↻ Att repetera</small><strong>${due().length}</strong><em>Fel blir till nya insikter</em></div></div><div class="cols"><section><div class="sectionhead"><h2>Vad vill du träna idag?</h2><button class="quiet" onclick="go('practice')">Alla delprov ↗</button></div><div class="grid">${['XYZ','ORD','KVA','LÄS'].map(subjectCard).join('')}</div><div class="card space"><div class="eyebrow">REKOMMENDERAT FÖR DIG</div><h3>${state.history.length?'Ge '+weak+' lite extra uppmärksamhet':'Börja med ett blandat diagnospass'}</h3><p>${state.history.length?'Baserat på din träffsäkerhet i appen. Ett kort pass hjälper dig att befästa grunderna.':'Upptäck dina styrkor och få en utgångspunkt för din fortsatta träning.'}</p><button class="secondary" onclick="start('${state.history.length?weak:'Alla'}',16)">Träna nu →</button></div></section><section><div class="sectionhead"><h2>Din studievecka</h2><span class="tag">${state.minutes} min / dag</span></div><div class="card"><div class="dayrow">${Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let done=state.history.some(h=>h.day===day(d));return `<span>${['S','M','T','O','T','F','L'][d.getDay()]}<b>${done?'✓':d.getDate()}</b></span>`}).join('')}</div><p style="font-size:13px">Lite regelbunden träning ger dig fler tillfällen att minnas, testa och förstå.</p><button class="secondary wide" onclick="go('plan')">Öppna min studieplan ↗</button></div><div class="card note space"><div class="eyebrow">DAGENS STUDIETIPS</div><h3>Gör dina misstag användbara.</h3><p>Skriv en mening om varför du valde fel. Försök sedan igen utan att titta på lösningen.</p><button class="quiet" onclick="go('review')">Till repetitionen →</button></div></section></div>`};
views.practice=()=>heading('TRÄNA MED AVSIKT','Åtta delar. En starkare helhet.','Välj delprov och arbeta i din egen takt. Alla frågor är egenproducerat träningsmaterial.')+`<div class="actions"><button class="primary" onclick="start('Alla',16)">Blandat diagnospass · 16 frågor →</button>${session?'<button class="secondary" onclick="resume()">Fortsätt sparat pass</button>':''}</div><div class="pillrow">${['Alla','Kvantitativt','Verbalt'].map(x=>`<button class="${filter===x?'selected':''}" onclick="filter='${x}';render()">${x}</button>`).join('')}</div><div class="grid">${Object.keys(subjects).filter((s,i)=>filter==='Alla'||(filter==='Kvantitativt'?i<4:i>=4)).map(subjectCard).join('')}</div><p>${questions.length} träningsfrågor totalt. Vissa mattefrågor tränar samma metod med olika tal. NOG, lästexter och engelska har en mindre startbank.</p>`;
function start(s='Alla',n=10,timed=0,ids=null){if(session){page='replace';state.pending={s,n,timed,ids};render();return}begin(s,n,timed,ids)}function begin(s,n,timed,ids){let pool=ids?questions.filter(q=>ids.includes(q.id)):questions.filter(q=>s==='Alla'||s==='Kvantitativt'?s==='Alla'||['XYZ','KVA','NOG','DTK'].includes(q.s):s==='Verbalt'?['ORD','LÄS','MEK','ELF'].includes(q.s):q.s===s);let list;if(s==='Alla'&&!ids){list=shuffle(Object.keys(subjects).flatMap(k=>shuffle(pool.filter(q=>q.s===k)).slice(0,Math.ceil(n/8)))).slice(0,n)}else list=shuffle(pool).slice(0,n);if(!list.length){toast('Inga frågor att träna här ännu.');return}session={ids:list.map(q=>q.id),at:0,answers:{},timed,deadline:timed?Date.now()+timed*60000:0,started:Date.now(),done:false};save();page='quiz';render()}views.replace=()=>heading('DU HAR ETT SPARAT PASS','Fortsätt eller börja om?','Dina redan rättade svar finns kvar i statistiken.')+`<div class="card actions"><button class="primary" onclick="resume()">Fortsätt sparat pass</button><button class="secondary" onclick="let p=state.pending;session=null;begin(p.s,p.n,p.timed,p.ids)">Ersätt med nytt pass</button><button class="quiet" onclick="go('practice')">Tillbaka</button></div>`;function resume(){page='quiz';render()}
function choose(i){let q=questions.find(q=>q.id===session.ids[session.at]);if(session.answers[q.id]?.graded||i<0||i>=q.o.length)return;session.answers[q.id]={choice:i,graded:false};save();render()}function grade(q,choice){if(session.answers[q.id]?.graded)return;let ok=choice===q.a;state.history.push({id:q.id,ok,choice,day:day(),time:Date.now()});let prev=state.reviews[q.id];if(!ok)state.reviews[q.id]={due:Date.now(),level:0};else if(prev){let level=Math.min(5,prev.level+1);state.reviews[q.id]={level,due:Date.now()+[0,1,3,7,14,30][level]*86400000}}session.answers[q.id]={choice,graded:true};save()}function check(){let q=questions.find(q=>q.id===session.ids[session.at]);let a=session.answers[q.id];if(!a){toast('Välj ett svar först.');return}grade(q,a.choice);render()}function move(n){session.at=Math.max(0,Math.min(session.ids.length-1,session.at+n));save();render()}function mark(id){state.marks=state.marks.includes(id)?state.marks.filter(x=>x!==id):[...state.marks,id];save();render()}function finish(){if(!session)return;session.ids.forEach(id=>{let q=questions.find(q=>q.id===id);grade(q,session.answers[id]?.choice??-1)});session.done=true;save();render()}function timeText(ms){let s=Math.max(0,Math.ceil(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}function tick(){clearInterval(interval);if(!session||!session.timed||session.done)return;function update(){let left=session.deadline-Date.now();if($('#clock'))$('#clock').textContent=timeText(left);if(left<=0){clearInterval(interval);finish();toast('Tiden är slut. Passet har rättats.')}}update();interval=setInterval(update,1000)}
views.quiz=()=>{if(!session)return views.practice();if(session.done){let correct=session.ids.filter(id=>session.answers[id]?.choice===questions.find(q=>q.id===id).a).length;return heading('PASS AVKLARAT','Bra jobbat. Nu växer kunskapen.','Ta en stund och läs igenom lösningarna.')+`<div class="card"><h2>${correct} av ${session.ids.length} rätt · ${Math.round(correct/session.ids.length*100)} %</h2><p>Det här är ett träningsresultat, inte ett normerat HP-resultat. Obesvarade frågor räknas som fel.</p><div class="actions"><button class="primary" onclick="session=null;save();go('review')">Repetera misstagen →</button><button class="secondary" onclick="session=null;save();go('home')">Till överblicken</button></div></div>${session.ids.map(id=>{let q=questions.find(q=>q.id===id),a=session.answers[id];return `<details><summary>${a.choice===q.a?'✓':'○'} ${q.s}: ${esc(q.q.split('\n')[0])}</summary>${q.text?`<div class="reading">${esc(q.text)}</div>`:''}<p>${esc(q.q)}</p><p>Ditt svar: ${esc(q.o[a.choice]||'Obesvarad')}<br>Rätt svar: ${esc(q.o[q.a])}</p><p>${esc(q.e)}</p></details>`}).join('')}`};let q=questions.find(q=>q.id===session.ids[session.at]),a=session.answers[q.id],show=a?.graded&&!session.timed;return `<div class="quiz"><div class="quiztop"><button class="quiet" onclick="go('practice')">← Lämna & spara</button><span class="tag">${q.s} · ${session.at+1} / ${session.ids.length}</span>${session.timed?'<span id="clock" class="timer"></span>':'<span>Träna i din takt</span>'}</div><progress value="${session.at+1}" max="${session.ids.length}"></progress><div class="card space"><div class="sectionhead"><span class="eyebrow">${subjects[q.s][0]}</span><button class="quiet" onclick="mark(${q.id})">${state.marks.includes(q.id)?'★ Sparad':'☆ Spara'}</button></div>${q.text?`<div class="reading">${esc(q.text)}</div>`:''}<div class="qbody">${esc(q.q)}</div><div class="options">${q.o.map((o,i)=>`<button class="option ${a?.choice===i?'selected':''} ${show&&i===q.a?'correct':''} ${show&&a.choice===i&&i!==q.a?'wrong':''}" onclick="choose(${i})" ${show?'disabled':''}><b>${String.fromCharCode(65+i)}</b>${esc(o)}</button>`).join('')}</div>${show?`<div class="explanation"><strong>${a.choice===q.a?'✓ Rätt svar!':'Dags för en ny insikt.'}</strong><p>${esc(q.e)}</p><label for="reflection">Min lärdom från frågan</label><input id="reflection" placeholder="Vad vill du komma ihåg?" value="${esc(state.notes[q.id]||'')}" onchange="state.notes[${q.id}]=this.value;save()"></div>`:''}<div class="actions">${!session.timed&&!show?'<button class="primary" onclick="check()">Rätta & förstå</button>':''}<button class="secondary" onclick="move(-1)" ${session.at===0?'disabled':''}>← Föregående</button>${session.at<session.ids.length-1?'<button class="primary" onclick="move(1)">Nästa →</button>':'<button class="primary" onclick="page=\'finish\';render()">Avsluta pass →</button>'}</div></div><div class="pillrow">${session.ids.map((id,i)=>`<button class="${i===session.at?'selected':''}" aria-label="Fråga ${i+1}" onclick="session.at=${i};save();render()">${i+1}${session.answers[id]?' •':''}</button>`).join('')}</div><p style="font-size:12px">${session.timed?'Tiden fortsätter även om du lämnar vyn. Svaren rättas när du avslutar.':'Du kan lämna passet när som helst. Dina svar sparas i den här webbläsaren.'}</p></div>`};
views.finish=()=>heading('AVSLUTA PASS','Redo att rätta?','Obesvarade frågor kommer att räknas som fel.')+`<div class="card"><p>${session.ids.filter(id=>session.answers[id]).length} av ${session.ids.length} frågor har ett valt svar.</p><div class="actions"><button class="primary" onclick="page='quiz';finish()">Avsluta och visa resultat</button><button class="secondary" onclick="resume()">Tillbaka till frågorna</button></div></div>`;
views.exam=()=>heading('TEMPO & UTHÅLLIGHET','Träna med klockan.','Bygg tempo med egna träningspass. Gör officiella fullängdspass under Gamla prov.')+`<div class="grid">${[['Snabbpass','10 blandade frågor · 10 minuter','Alla',10,10],['Kvantitativt pass','20 frågor · 28 minuter','Kvantitativt',20,28],['Verbalt pass','20 frågor · 28 minuter','Verbalt',20,28],['Diagnos i lugn och ro','16 blandade frågor · utan tid','Alla',16,0]].map(([t,d,s,n,m])=>`<div class="card"><span class="tag">${m?'På tid':'Utan tid'}</span><h2 class="space">${t}</h2><p>${d}</p><button class="primary" onclick="start('${s}',${n},${m})">Starta pass →</button></div>`).join('')}</div><div class="card space"><h3>Så fungerar provläget</h3><p>Du kan ändra svar och hoppa mellan frågor. Förklaringar visas efter avslutat pass. Klockan fortsätter när du lämnar vyn. När tiden tar slut rättas passet automatiskt när appen är öppen eller när du återvänder.</p><p>Ett officiellt provpass omfattar 40 uppgifter på 55 minuter. Dessa kortare träningspass återger inte den officiella uppgiftsfördelningen.</p></div>`;
views.lessons=()=>heading('FÖRSTÅ PÅ DJUPET','Från ”hur?” till ”aha!”.','Metoder, lösta exempel och små kontrollfrågor som bygger en stabil grund.')+`<div class="pillrow">${['Alla',...Object.keys(subjects)].map(s=>`<button class="${filter===s?'selected':''}" onclick="filter='${s}';render()">${s}</button>`).join('')}</div><div class="grid">${lessons.map((l,i)=>filter==='Alla'||filter===l[0]?`<button class="card lesson" style="text-align:left;color:var(--ink)" onclick="openLesson(${i})"><div class="sectionhead"><span class="tag">${l[0]}</span><span class="number">${String(i+1).padStart(2,'0')} · 4 min</span></div><h2>${l[1]}</h2><p>${l[2]}</p><span style="font-size:12px;color:var(--green)">Läs genomgång →</span></button>`:'').join('')}</div>`;let lesson=0;function openLesson(i){lesson=i;page='article';render();window.scrollTo(0,0)}views.article=()=>{let l=lessons[lesson];return `<article class="article"><button class="quiet space" onclick="go('lessons')">← Alla genomgångar</button>${heading(l[0],l[1],l[2])}<div class="card"><h2>Så fungerar det</h2><p>${l[3]}</p><div class="example"><h3>Ett exempel, steg för steg</h3><p>${l[4]}</p></div><h3>Vanligt misstag</h3><p>${l[5]}</p><h3>Prova själv</h3><p>${l[6]}</p><details><summary>Visa lösningen</summary><p>${l[7]}</p></details><button class="primary" onclick="start('${l[0]}')">Öva ${l[0]} →</button></div></article>`};
views.review=()=>{let ids=filter==='Bokmärken'?state.marks:due().map(q=>q.id);return heading('GÖR KUNSKAPEN HÅLLBAR','Dina misstag visar vägen.','Felaktiga svar återkommer. Rätta svar flyttas fram 1, 3, 7, 14 och 30 dagar.')+`<div class="pillrow">${['Repetition idag','Bokmärken'].map(s=>`<button class="${(filter==='Alla'&&s==='Repetition idag')||filter===s?'selected':''}" onclick="filter='${s}';render()">${s}</button>`).join('')}</div><div class="card"><h2>${ids.length} frågor ${filter==='Bokmärken'?'sparade':'redo att repeteras'}</h2>${ids.length?`<button class="primary" onclick='start("Alla",${ids.length},0,${JSON.stringify(ids)})'>Starta repetition →</button>`:'<p>Här samlas dina frågor efter att du har tränat. Du kan också spara frågor med stjärnan.</p><button class="secondary" onclick="go(\'practice\')">Till övningarna →</button>'}</div>${ids.map(id=>{let q=questions.find(q=>q.id===id);return `<div class="card space"><span class="tag">${q.s}</span><h3>${esc(q.q.split('\n')[0])}</h3>${state.notes[id]?`<p>Din lärdom: ${esc(state.notes[id])}</p>`:''}<button class="quiet" onclick="start('Alla',1,0,[${id}])">Träna frågan →</button></div>`}).join('')}`};
views.words=()=>{let w=words[flash%words.length];return heading('DITT ORDFÖRRÅD','Ett nytt ord. En ny nyans.','Försök minnas betydelsen innan du vänder kortet.')+`<div class="card empty" style="max-width:720px;margin:auto;min-height:300px"><span class="tag">${flash%words.length+1} / ${words.length}</span><h1 style="margin:45px 0 20px">${w[0]}</h1><p style="min-height:30px;font-size:22px">${flipped?w[1]:'Hur skulle du förklara ordet?'}</p><button class="primary" onclick="flipped=!flipped;render()">${flipped?'Dölj betydelsen':'Vänd kortet'}</button></div><div class="actions" style="justify-content:center"><button class="secondary" onclick="flash=(flash+words.length-1)%words.length;flipped=false;render()">← Föregående</button><button class="secondary" onclick="flash++;flipped=false;render()">Nästa ord →</button><button class="quiet" onclick="start('ORD')">Testa med alternativ ↗</button></div>`};
views.stats=()=>heading('DIN UTVECKLING','Se vad träningen ger.','Resultaten bygger på besvarade frågor i den här webbläsaren.')+`<div class="stats"><div class="stat"><small>Besvarade frågor</small><strong>${state.history.length}</strong></div><div class="stat"><small>Träffsäkerhet</small><strong>${rate(state.history)} %</strong></div><div class="stat"><small>Aktiva dagar</small><strong>${new Set(state.history.map(h=>h.day)).size}</strong></div><div class="stat"><small>Bokmärken</small><strong>${state.marks.length}</strong></div></div><div class="cols"><div class="card"><h2>De senaste sju dagarna</h2><div class="chart">${Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let n=state.history.filter(h=>h.day===day(d)).length,max=Math.max(10,...Array.from({length:7},(_,j)=>{let x=new Date();x.setDate(x.getDate()-j);return state.history.filter(h=>h.day===day(x)).length}));return `<div style="height:${n/max*100}%" title="${n} frågor"><small>${d.getDate()}/${d.getMonth()+1}</small></div>`}).join('')}</div><p class="space">Antal besvarade frågor per dag.</p></div><div class="card"><h2>Dina delprov</h2>${Object.keys(subjects).map(s=>{let a=score(s);return `<div class="metricrow"><span>${s} <small>${a.length} svar</small></span><strong>${a.length?rate(a)+' %':'—'}</strong></div>`}).join('')}</div></div><div class="card space"><h2>Senaste svaren</h2>${state.history.length?`<table><thead><tr><th>Datum</th><th>Delprov</th><th>Resultat</th></tr></thead><tbody>${state.history.slice(-12).reverse().map(h=>`<tr><td>${h.day}</td><td>${questions.find(q=>q.id===h.id)?.s}</td><td>${h.ok?'✓ Rätt':'○ Repetera'}</td></tr>`).join('')}</tbody></table>`:'<p>Gör ditt första pass så börjar din utveckling synas här.</p>'}</div>`;

function exportData(){let blob=new Blob([JSON.stringify({...state,session},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hp-fokus-'+day()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(file){if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.history)||!Array.isArray(d.marks)||!d.reviews||!d.notes||d.history.some(h=>!questions.some(q=>q.id===h.id)||typeof h.ok!=='boolean'||!/^\d{4}-\d{2}-\d{2}$/.test(h.day))||d.marks.some(id=>!questions.some(q=>q.id===id)))throw Error();state.pendingImport=d;page='import';render()}catch{toast('Filen kunde inte läsas som en HP Fokus-säkerhetskopia.')}}views.import=()=>heading('ÅTERSTÄLL SÄKERHETSKOPIA','Ersätt dina nuvarande framsteg?','Importen ersätter lokala data. Exportera först om du vill spara din nuvarande historik.')+`<div class="card"><p>${state.pendingImport.history.length} sparade svar hittades.</p><div class="actions"><button class="primary" onclick="applyImport()">Importera och ersätt</button><button class="secondary" onclick="delete state.pendingImport;go('settings')">Avbryt</button></div></div>`;function applyImport(){let d=state.pendingImport;state={...state,...d};delete state.pendingImport;state.goal=Math.min(100,Math.max(5,Number(d.goal)||20));state.minutes=Math.min(180,Math.max(5,Number(d.minutes)||25));session=d.session&&Array.isArray(d.session.ids)&&d.session.ids.every(id=>questions.some(q=>q.id===id))?d.session:null;save();go('home');toast('Din säkerhetskopia är importerad.')}

window.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});</script><script>function authErrorMessage(error){const code=String(error?.code||'');const message=String(error?.message||'');if(code==='email_not_confirmed')return 'Bekräfta din e-post först. Öppna bekräftelsemejlet och klicka på länken innan du loggar in.';if(code==='invalid_credentials')return 'Fel e-postadress eller lösenord. Kontrollera uppgifterna eller välj Glömt lösenord.';if(code==='email_address_not_authorized'||/email address.*not authorized|only.*authorized|only.*team/i.test(message))return 'Supabase kan inte skicka till den här e-postadressen ännu. Webbplatsens ägare behöver konfigurera SMTP i Supabase → Authentication → Email.';if(code==='over_email_send_rate_limit'||/email rate limit/i.test(message))return 'Gränsen för mejlutskick är nådd. Vänta innan du försöker igen. Webbplatsens ägare kan behöva konfigurera SMTP.';if(code==='weak_password')return 'Lösenordet uppfyller inte kraven. '+message;if(code==='signup_disabled')return 'Nya konton är avstängda i Supabase. Webbplatsens ägare behöver aktivera registrering.';if(code==='email_address_invalid'||/invalid.*email/i.test(message))return 'Kontrollera att e-postadressen är korrekt skriven.';if(error?.status===429)return 'För många försök. Vänta en stund och försök igen.';if(/fetch|network|timeout|abort/i.test(message))return 'Anslutningen misslyckades. Kontrollera internet och försök igen.';return 'Kontotjänsten svarade: '+(message||'Okänt fel. Försök igen.')}

function defaultProgress(){return {history:[],marks:[],notes:{},reviews:{},goal:20,target:'1.5',minutes:25,exam:'',theme:state.theme,session:null}}
function progressPayload(){return {history:state.history,marks:state.marks,notes:state.notes,reviews:state.reviews,goal:state.goal,target:state.target,minutes:state.minutes,exam:state.exam,theme:state.theme,session}}
function validProgress(data){return data&&typeof data==='object'&&Array.isArray(data.history)&&Array.isArray(data.marks)&&data.notes&&typeof data.notes==='object'&&data.reviews&&typeof data.reviews==='object'&&data.history.every(h=>Number.isInteger(h.id)&&questions.some(q=>q.id===h.id)&&typeof h.ok==='boolean'&&/^\d{4}-\d{2}-\d{2}$/.test(h.day))&&data.marks.every(id=>questions.some(q=>q.id===id))}
function loadProgress(data){if(!validProgress(data))throw Error('Sparade data har ett okänt format.');state={...defaultProgress(),...data};state.goal=Math.min(100,Math.max(5,Number(state.goal)||20));state.minutes=Math.min(180,Math.max(5,Number(state.minutes)||25));session=data.session&&Array.isArray(data.session.ids)&&data.session.ids.every(id=>questions.some(q=>q.id===id))&&Number.isInteger(data.session.at)&&data.session.at>=0&&data.session.at<data.session.ids.length&&data.session.answers?data.session:null;state.session=session;clearInterval(interval)}
function cloudMeta(){if(!cloudUser)return;localStorage.setItem(cloudMetaPrefix+cloudUser.id,JSON.stringify({version:cloudVersion,dirty:cloudDirty}))}

function cloudError(error){if(error?.code==='42501')return 'Databasens behörigheter är inte färdiga. Kontrollera SQL-installationen.';if(error?.code==='PGRST202'||error?.code==='42P01')return 'Kör databasfilen i Supabase innan du använder molnsparandet.';return 'Kunde inte ansluta. Dina ändringar finns kvar på den här enheten.'}
async function syncCloud(){if(!cloudClient||!cloudUser||!cloudReady||cloudConflict||!cloudDirty)return !cloudConflict;if(cloudSaving)return cloudSaving;clearTimeout(cloudTimer);const userId=cloudUser.id;cloudSaving=(async()=>{try{cloudMessage='Sparar…';updateAccountLabel();const snapshot=JSON.stringify(progressPayload());const {data,error}=await cloudClient.rpc('hp_save_progress',{p_data:JSON.parse(snapshot),p_version:cloudVersion});if(cloudUser?.id!==userId)return false;if(error){if(error.code==='40001'){await readConflict();return false}throw error}cloudVersion=Number(data[0].version);cloudDirty=JSON.stringify(progressPayload())!==snapshot;cloudMeta();cloudMessage=cloudDirty?'Ändringar väntar':'Sparat i molnet';updateAccountLabel();if(cloudDirty)scheduleCloud();return true}catch(error){cloudMessage=cloudError(error);updateAccountLabel();return false}finally{cloudSaving=null}})();return cloudSaving}
async function readConflict(){const {data,error}=await cloudClient.from('hp_progress').select('data,version,updated_at').eq('user_id',cloudUser.id).maybeSingle();if(error)throw error;cloudConflict=data||{data:defaultProgress(),version:0};cloudMessage='Två olika versioner – välj vilken du vill behålla';updateAccountLabel();if(page==='account')render()}
async function connectUser(user){cloudReady=false;cloudBusy=true;cloudUser=user;cloudConflict=null;clearTimeout(cloudTimer);key=accountPrefix+user.id;let cached=null,meta={};try{cached=JSON.parse(localStorage.getItem(key));meta=JSON.parse(localStorage.getItem(cloudMetaPrefix+user.id))||{}}catch{}cloudVersion=Number(meta.version)||0;cloudDirty=!!meta.dirty;loadProgress(validProgress(cached)?cached:defaultProgress());page='account';render();try{const {data,error}=await cloudClient.from('hp_progress').select('data,version,updated_at').eq('user_id',user.id).maybeSingle();if(error)throw error;if(data){if(cloudDirty&&cloudVersion!==Number(data.version)){cloudConflict=data;cloudMessage='Två olika versioner – välj vilken du vill behålla'}else if(cloudDirty){cloudMessage='Ändringar väntar'}else{loadProgress(data.data);cloudVersion=Number(data.version);cloudMessage='Hämtat från molnet'}}else{cloudVersion=0;cloudDirty=true;cloudMessage='Redo att spara ditt nya konto'}cloudReady=true;localSave();cloudMeta();if(cloudDirty&&!cloudConflict)scheduleCloud()}catch(error){cloudMessage=cloudError(error);cloudReady=true}finally{cloudBusy=false;render()}}
async function resolveCloud(useCloud){if(!cloudConflict)return;try{if(useCloud){loadProgress(cloudConflict.data);cloudVersion=Number(cloudConflict.version);cloudDirty=false;cloudConflict=null;localSave();cloudMeta();cloudMessage='Molnversionen är inläst';render()}else{cloudVersion=Number(cloudConflict.version);cloudConflict=null;cloudDirty=true;cloudMeta();await syncCloud();render()}}catch{toast('Data kunde inte läsas. Exportera en säkerhetskopia innan du fortsätter.')}}
async function signOutAccount(){cloudBusy=true;render();try{for(let attempt=0;cloudDirty&&attempt<3;attempt++){if(!(await syncCloud()))break}if(cloudDirty){toast('Synkronisera eller lös versionskonflikten innan du loggar ut.');return}const {error}=await cloudClient.auth.signOut();if(error)throw error;cloudUser=null;cloudReady=false;cloudConflict=null;clearTimeout(cloudTimer);key=guestKey;let g;try{g=JSON.parse(localStorage.getItem(key))}catch{}loadProgress(validProgress(g)?g:defaultProgress());cloudMessage='Utloggad';page='account'}catch{toast('Utloggningen misslyckades. Försök igen.')}finally{cloudBusy=false;render()}}
async function submitAccount(event){event.preventDefault();if(!cloudClient||cloudBusy)return;const form=event.target,email=form.elements.email.value.trim(),mode=form.dataset.mode,password=form.elements.password?.value;accountEmail=email;cloudBusy=true;cloudMessage=mode==='signup'?'Skapar ditt konto…':mode==='reset'?'Skickar återställningslänk…':'Loggar in…';render();try{const redirect=location.origin+location.pathname;let result;if(mode==='signup')result=await cloudClient.auth.signUp({email,password,options:{emailRedirectTo:redirect}});else if(mode==='reset')result=await cloudClient.auth.resetPasswordForEmail(email,{redirectTo:redirect});else result=await cloudClient.auth.signInWithPassword({email,password});if(result.error)throw result.error;if(result.data?.session){await connectUser(result.data.user)}else{cloudMessage=mode==='signup'?'Kontrollera din e-post och bekräfta kontot. Logga sedan in här.':'Om adressen har ett konto skickas ett mejl med nästa steg.'}}catch(error){cloudMessage=authErrorMessage(error)}finally{cloudBusy=false;render()}}

views.notebook=()=>{studyExtras();const questionNotes=Object.entries(state.notes).filter(([id,text])=>String(text).trim()&&questions.some(q=>q.id===Number(id)));return heading('DINA EGNA INSIKTER','Skriv så att du minns.','Samla metoder, svåra begrepp och lärdomar från dina frågor.')+`<div class="actions"><button class="primary" onclick="openNote(null)">+ Ny anteckning</button><button class="secondary" onclick="exportData()">Exportera säkerhetskopia</button></div><h2 class="space">Mina anteckningar · ${state.notebook.length}</h2><div class="grid">${state.notebook.map(n=>`<div class="card"><span class="tag">${esc(n.subject||'Allmänt')}</span><h3>${esc(n.title)}</h3><p class="note-preview">${esc(String(n.body).slice(0,220))}${String(n.body).length>220?'…':''}</p><button class="quiet" onclick="openNote('${esc(n.id)}')">Öppna & redigera →</button></div>`).join('')||'<div class="card"><p>En egen formulering hjälper dig att förstå. Spara din första insikt här.</p></div>'}</div><h2 class="space">Lärdomar från frågor · ${questionNotes.length}</h2><div class="grid">${questionNotes.map(([id,text])=>{const q=questions.find(q=>q.id===Number(id));return `<div class="card"><span class="tag">${q.s} · #${q.id}</span><h3>${esc(q.q.split('\n')[0])}</h3><p class="note-preview">${esc(text)}</p><button class="secondary" onclick="start('Alla',1,0,[${q.id}])">Träna igen →</button></div>`}).join('')||'<div class="card"><p>Anteckningar du skriver efter rättning visas också här.</p></div>'}</div>`};
views.noteEditor=()=>{const note=state.notebook.find(n=>n.id===editNoteId);return heading('ANTECKNINGSBOK',note?'Fortsätt din tanke.':'Vad vill du komma ihåg?','Anteckningen sparas i ditt valda läge.')+`<form class="card article" onsubmit="saveStudyNote(event)"><label for="note-title">Rubrik</label><input id="note-title" name="title" maxlength="120" required value="${esc(note?.title||'')}" placeholder="Till exempel: så räknar jag procent"><label for="note-subject">Delprov</label><select id="note-subject" name="subject">${['Allmänt',...Object.keys(subjects)].map(x=>`<option ${x===note?.subject?'selected':''}>${x}</option>`).join('')}</select><label for="note-body">Min förklaring med egna ord</label><textarea id="note-body" name="body" maxlength="8000" rows="10" required placeholder="Skriv metoden, ett exempel och det du lätt glömmer…">${esc(note?.body||'')}</textarea><div class="actions"><button class="primary">Spara anteckning</button><button type="button" class="secondary" onclick="go('notebook')">Avbryt</button>${note?'<button type="button" class="quiet danger" onclick="page=\'deleteNote\';render()">Radera…</button>':''}</div></form>`};
function saveStudyNote(event){event.preventDefault();const f=event.target.elements,title=f.title.value.trim(),body=f.body.value.trim();if(!title||!body){toast('Skriv både rubrik och text.');return}const note={id:editNoteId||Date.now().toString(36)+Math.random().toString(36).slice(2,8),title:title.slice(0,120),body:body.slice(0,8000),subject:f.subject.value,updated:Date.now()};state.notebook=state.notebook.filter(n=>n.id!==note.id);state.notebook.unshift(note);save();go('notebook');toast('Anteckningen är sparad.')}
views.deleteNote=()=>heading('RADERA ANTECKNING','Ta bort den här anteckningen?','Åtgärden sparas i ditt nuvarande läge.')+`<div class="actions"><button class="secondary" onclick="page='noteEditor';render()">Behåll</button><button class="primary" onclick="state.notebook=state.notebook.filter(n=>n.id!==editNoteId);save();go('notebook')">Radera anteckningen</button></div>`;
function focusLeft(){studyExtras();return state.focus.deadline?Math.max(0,state.focus.deadline-Date.now()):state.focus.remaining}
function paintFocus(){const clock=document.querySelector('#focus-clock');if(clock)clock.textContent=timeText(focusLeft());const badge=document.querySelector('#focus-badge');if(badge){badge.hidden=!state.focus?.deadline;badge.textContent='◴ '+timeText(focusLeft())}}
function startFocus(){studyExtras();if(state.focus.deadline)return;const remaining=state.focus.remaining>0?state.focus.remaining:state.focus.minutes*60000;state.focus.remaining=remaining;state.focus.deadline=Date.now()+remaining;save();render()}
function pauseFocus(){if(!state.focus.deadline)return;state.focus.remaining=focusLeft();state.focus.deadline=0;save();render()}
function resetFocus(minutes=state.focus.minutes){state.focus={...state.focus,minutes,remaining:minutes*60000,deadline:0};save();render()}
function finishFocus(){state.focus.deadline=0;state.focus.remaining=0;state.focus.completed=(Number(state.focus.completed)||0)+1;save();if(page==='tools')render();else paintFocus();toast('Fokuspasset är klart. Ta en paus och sträck på dig.')}
setInterval(()=>{if(state.focus?.deadline&&focusLeft()<=0)finishFocus();else paintFocus()},1000);
const formulae=[['Procent','Del / helhet = andel. Nytt värde = gammalt värde × förändringsfaktor. +20 % → ×1,20. −20 % → ×0,80.'],['Procentenheter','Från 20 % till 30 % är +10 procentenheter. Den relativa ökningen är 10/20 = 50 %.'],['Geometri','Rektangel: A = b × h. Triangel: A = b × h / 2. Cirkel: A = πr², omkrets = 2πr.'],['Pythagoras','I en rätvinklig triangel: a² + b² = c². c är hypotenusan, den längsta sidan.'],['Medelvärde och median','Medelvärde = summa / antal. Median = mittenvärdet i sorterad ordning; vid jämnt antal, medelvärdet av de två mittersta.'],['Hastighet','Sträcka = hastighet × tid. 1 m/s = 3,6 km/h. Om hastigheten anges i km/h måste tiden anges i timmar.'],['Sannolikhet','Vid lika sannolika utfall: P = gynnsamma / möjliga. Oberoende händelser: P(A och B) = P(A) × P(B).'],['Potenser','aᵐ × aⁿ = aᵐ⁺ⁿ. aᵐ / aⁿ = aᵐ⁻ⁿ för a ≠ 0. (aᵐ)ⁿ = aᵐⁿ. a⁰ = 1 för a ≠ 0.']];
const examChecklist=['Läs de aktuella instruktionerna i din kallelse.','Kontrollera provlokal, resväg och restid.','Kontrollera vilken legitimation och vilka hjälpmedel som tillåts.','Planera mat, vatten och pauser enligt provets regler.','Packa kvällen före och planera en lugn morgon.','Prioritera sömn och lätt repetition sista kvällen.'];
function milestones(){return [['Första steget',state.history.length>=1,'Besvara din första fråga.'],['En bra vana',new Set(state.history.map(h=>h.day)).size>=3,'Träna under tre olika dagar.'],['Bredden först',new Set(state.history.map(h=>questions.find(q=>q.id===h.id)?.s)).size>=8,'Prova alla åtta delprov.'],['50 försök',state.history.length>=50,'Besvara 50 frågor, även repetition räknas.'],['Egen förståelse',(state.notebook?.length||0)+Object.values(state.notes).filter(Boolean).length>=1,'Spara en egen lärdom eller anteckning.'],['Tid för fokus',(state.focus?.completed||0)>=1,'Slutför ett fokuspass.']]}
views.tools=()=>{studyExtras();return heading('BYGG DIN STUDIERYTM','Verktygen runt träningen.','Fokusera, repetera grunderna och förbered nästa steg.')+`<div class="cols"><section class="card focus-panel"><span class="tag">FOKUSTIMER</span><h2 class="space">En sak i taget.</h2><p>Timern följer med när du byter vy. Den ger en påminnelse i appen när du återvänder, även om fliken varit stängd.</p><div class="focus-clock" id="focus-clock" role="timer" aria-label="Återstående fokustid">${timeText(focusLeft())}</div><div class="pillrow">${[15,25,45].map(m=>`<button class="${state.focus.minutes===m?'selected':''}" onclick="resetFocus(${m})">${m} min</button>`).join('')}</div><div class="actions"><button class="primary" onclick="${state.focus.deadline?'pauseFocus()':'startFocus()'}">${state.focus.deadline?'Pausa':'Starta fokus'}</button><button class="secondary" onclick="resetFocus()">Börja om</button><button class="quiet" onclick="go('practice')">Till träningen →</button></div><p>${state.focus.completed||0} slutförda fokuspass.</p></section><section class="card"><h2>Små milstolpar</h2><p>Påminnelser om det arbete du lagt ner, inte prognoser om provresultat.</p>${milestones().map(([name,done,text])=>`<div class="milestone ${done?'earned':''}"><span aria-hidden="true">${done?'✓':'○'}</span><div><strong>${name}</strong><small>${text}</small></div></div>`).join('')}</section></div><div class="cols space"><section class="card"><h2>Formler & snabba påminnelser</h2><p>Öppna den regel du behöver repetera.</p>${formulae.map(([t,b])=>`<details><summary>${t}</summary><p>${b}</p></details>`).join('')}</section><section class="card" style="align-self:start"><h2>Inför provdagen</h2><p>Din egen checklista. Kontrollera alltid detaljer i den aktuella kallelsen.</p>${examChecklist.map((text,i)=>`<label class="checklist-item"><input type="checkbox" ${state.checklist[i]?'checked':''} onchange="state.checklist[${i}]=this.checked;save()"><span>${text}</span></label>`).join('')}<a href="https://www.studera.nu/hogskoleprov/" target="_blank" rel="noopener">Aktuell information hos UHR ↗</a></section></div>`};
const toolsSettings=views.settings;views.settings=()=>toolsSettings()+`<div class="card space"><h2>Lässtorlek</h2><p>Välj större text för frågor, lästexter och genomgångar.</p><div class="pillrow">${[[1,'Standard'],[1.12,'Större'],[1.25,'Störst']].map(([v,t])=>`<button class="${state.readingScale===v?'selected':''}" onclick="state.readingScale=${v};save();render()">${t}</button>`).join('')}</div></div>`;
const toolsHome=views.home;views.home=()=>toolsHome()+`<div class="grid space"><button class="card search-result" onclick="go('search')"><span class="tag">ETT PASS PÅ DINA VILLKOR</span><h2 class="space">Träna det du behöver.</h2><p>Sök, filtrera otränade frågor och bygg ett eget pass.</p><span>Öppna frågebanken →</span></button><button class="card search-result" onclick="go('tools')"><span class="tag">DIN STUDIERYTM</span><h2 class="space">Ge träningen lite fokus.</h2><p>Fokustimer, formelsamling, milstolpar och provchecklista.</p><span>Öppna studieverktyg →</span></button></div>`;
const originalNoteLoad=loadProgress;loadProgress=function(data){originalNoteLoad(data);studyExtras()};
studyExtras();render();
</script><script>// Authored extensions: keep lesson indices stable so saved progress survives updates.
const lessonGuides=[
{goal:'Kunna växla mellan procent, andel och förändringsfaktor och upptäcka när jämförelsebasen ändras.',steps:['Bestäm vad som är 100 %. Skriv gärna det gamla värdet på en egen rad.','Gör om procent till decimal: 12 % = 0,12. För ett nytt värde använder du 1 ± andelen.','Vid flera förändringar multiplicerar du faktorerna. Du adderar inte procentsatserna.','Om slutvärdet är känt: dividera med faktorn för att hitta ursprunget.'],example:['Efter en sänkning med 20 % kostar en cykel 2 400 kr. Vad kostade den först?',['Låt ursprungspriset vara x. Efter rabatten återstår 80 %: 0,80x = 2 400.','Dividera båda leden med 0,80: x = 2 400 / 0,80 = 3 000.','Kontrollera framåt: 3 000 × 0,80 = 2 400. Svaret är 3 000 kr.']],trap:'Att lägga på 20 % på slutpriset ger 2 880 kr, inte ursprunget. Återgången räknas på ett mindre belopp och kräver en annan procentsats.',checks:[['Ett pris höjs med 10 % och sänks sedan med 10 %. Vad händer jämfört med ursprunget?',['Oförändrat','Minskar med 1 %','Ökar med 1 %','Minskar med 10 %'],1,'1,10 × 0,90 = 0,99. Du har kvar 99 % av ursprunget.'],['30 % av ett tal är 45. Vilket är talet?',['135','150','15','75'],1,'0,30x = 45 → x = 45 / 0,30 = 150. Kontroll: 10 % är 15, så 30 % är 45.']]},
{goal:'Lösa linjära ekvationer med parenteser och okända i båda leden samt kontrollera resultatet.',steps:['Förenkla först parenteser. Multiplicera varje term i parentesen.','Samla alla x-termer på ena sidan genom samma operation i båda leden.','Samla konstanterna på andra sidan och dividera med koefficienten framför x.','Sätt in lösningen i den ursprungliga ekvationen. Båda sidor ska ge samma värde.'],example:['Lös 2(x + 3) = 3x − 4.',['Multiplicera in 2: 2x + 6 = 3x − 4.','Subtrahera 2x: 6 = x − 4. Addera 4: x = 10.','Kontroll: vänsterled 2(10 + 3) = 26. Högerled 3 × 10 − 4 = 26.']],trap:'2(x + 3) blir 2x + 6, inte 2x + 3. Ett minus framför en parentes påverkar varje term: −(x − 2) = −x + 2.',checks:[['Lös 5x − 8 = 2x + 7.',['x = 3','x = 5','x = −5','x = 15'],1,'Subtrahera 2x och addera 8: 3x = 15. Dividera med 3: x = 5.'],['Vilket uttryck är lika med 3 − (x − 4)?',['−x − 1','x − 1','7 − x','x + 7'],2,'Minustecknet ändrar båda termerna: 3 − x + 4 = 7 − x.']]},
{goal:'Räkna med bråk och förstå varför gemensam nämnare och invertering fungerar.',steps:['Förenkla genom att dividera täljare och nämnare med samma faktor. Bråkets värde ändras inte.','Vid addition och subtraktion: skriv delarna i samma storlek, alltså med gemensam nämnare.','Vid multiplikation: multiplicera täljare med täljare och nämnare med nämnare. Förkorta gärna först.','Vid division med ett bråk: multiplicera med dess invers. Att dela med 1/2 är att fråga hur många halvor som ryms.'],example:['Beräkna (3/4) / (2/5).',['Byt division mot multiplikation med inversen: (3/4) × (5/2).','Multiplicera: 15/8 = 1 7/8.','Rimlighet: 3/4 divideras med ett tal mindre än 1. Svaret ska bli större än 3/4, vilket 15/8 är.']],trap:'Du får inte stryka en term i en summa som om den vore en faktor. (x + 2)/x är inte 2. Du kan däremot förkorta 2x/x till 2 när x ≠ 0.',checks:[['Vad är 5/6 − 1/4?',['4/2','7/12','2/3','1/2'],1,'Gemensam nämnare 12: 10/12 − 3/12 = 7/12.'],['Vad är (2/3) × (9/4)?',['3/2','8/27','11/7','2/9'],0,'18/12 = 3/2. Du kan också förkorta 9 mot 3 och 2 mot 4 före multiplikationen.']]},
{goal:'Skilja mellan längd och area, välja vinkelrät höjd och använda Pythagoras där den gäller.',steps:['Rita en figur och skriv ut alla givna längder. Anta inte att en skiss är skalenlig.','Bestäm om frågan gäller omkrets, area eller längd. Enheterna hjälper: cm respektive cm².','Välj formel. Triangelns höjd är vinkelrät mot basen, även om höjden hamnar utanför triangeln.','Kontrollera att svaret har rätt enhet och är rimligt jämfört med figurens mått.'],example:['En rektangel är 9 cm bred och 12 cm lång. Bestäm diagonal och area.',['Diagonalen delar rektangeln i två rätvinkliga trianglar. d² = 9² + 12² = 225.','d = √225 = 15 cm. Den är längre än båda sidorna.','Arean använder en annan formel: A = 9 × 12 = 108 cm². Diagonalen är inte en höjd i areaformeln.']],trap:'Pythagoras gäller bara rätvinkliga trianglar. Om alla längder i en figur fördubblas fördubblas omkretsen, men arean fyrdubblas.',checks:[['En triangels bas är 10 cm och vinkelräta höjd 6 cm. Area?',['60 cm²','16 cm²','30 cm²','80 cm²'],2,'10 × 6 / 2 = 30 cm². Divisionen med 2 kommer av att triangeln är halva motsvarande parallellogram.'],['En kvadrats sida tredubblas. Hur förändras arean?',['Den tredubblas','Den sexdubblas','Den niodubblas','Den är oförändrad'],2,'A = s². Ny area är (3s)² = 9s², alltså nio gånger så stor.']]},
{goal:'Avgöra om två storheter kan jämföras entydigt utan att räkna mer än nödvändigt.',steps:['Läs villkoren före storheterna. Är variabeln positiv, negativ, heltal eller helt fri?','Ta bort samma uttryck från båda storheterna när det förenklar jämförelsen.','Testa flera tillåtna fall: negativa tal, noll, tal mellan 0 och 1, samt tal större än 1.','Om relationen ändras mellan två tillåtna fall är svaret att informationen inte räcker. Om du hävdar en fast relation behöver du ett argument för alla tillåtna värden.'],example:['x > 0. Jämför I: 1/x och II: x.',['Pröva x = 2: I = 1/2 och II = 2. Då är II större.','Pröva x = 1/2: I = 2 och II = 1/2. Då är I större.','Båda följer x > 0. Relationen varierar, så informationen räcker inte.']],trap:'En kvadrat är inte alltid större än grundtalet: (1/2)² = 1/4. Att multiplicera en olikhet med ett negativt tal vänder olikhetstecknet.',checks:[['x är ett reellt tal. Jämför I: x² och II: 0.',['I är alltid större','II är alltid större','Alltid lika','Informationen räcker inte för att välja en av de tre relationerna'],3,'För x = 0 är de lika. För x = 1 är I större. ”Alltid större” fungerar alltså inte trots att I aldrig är mindre.'],['x > 0. Jämför I: 3x + 2 och II: 2x + 2.',['I är större','II är större','De är lika','Informationen räcker inte'],0,'Skillnaden I − II är x. Eftersom x > 0 är I större. Det bevisar relationen för alla tillåtna x.']]},
{goal:'Bedöma informationsmängd systematiskt och skilja ett entydigt svar från ett möjligt svar.',steps:['Bestäm exakt vad som efterfrågas: ett tal eller ett ja/nej-besked.','Undersök (1) ensam tillsammans med grundvillkoren. Kan två olika svar uppstå? Då räcker den inte.','Undersök (2) ensam. Använd inte information från (1).','Om ingen räcker ensam: kombinera dem. Välj sedan det alternativ vars beskrivning stämmer.'],example:['Är x större än 5? Grundvillkor: x är ett heltal. (1) x > 4. (2) x < 7.',['(1) ensam: x = 5 ger nej och x = 6 ger ja. Den räcker inte.','(2) ensam: x = 3 ger nej och x = 6 ger ja. Den räcker inte.','Tillsammans återstår x = 5 eller 6. Svaret på frågan kan fortfarande vara nej eller ja. Inte ens tillsammans räcker.']],trap:'Att få ett intervall betyder inte automatiskt att informationen är otillräcklig. Om frågan är ”Är x positivt?” räcker x > 5 trots att x inte får ett exakt värde.',checks:[['Är x positivt? (1) x > 7. (2) x² = 4.',['Enbart (1)','Enbart (2)','Tillsammans, inte var för sig','Var och en för sig','Inte ens tillsammans'],0,'(1) ger alltid ja. (2) tillåter x = 2 och x = −2, så den ger olika svar.'],['Vad är x? (1) x + y = 9. (2) y = 4.',['Enbart (1)','Enbart (2)','Tillsammans, inte var för sig','Var och en för sig','Inte ens tillsammans'],2,'Ingen ensam bestämmer x. Tillsammans får vi x + 4 = 9, så x = 5.']]},
{goal:'Läsa av data med rätt enhet och välja rätt nämnare i andelar och förändringar.',steps:['Läs rubrik, tidsperiod, teckenförklaring och axlarnas enheter innan du jämför.','Översätt frågan till en beräkning: absolut skillnad, andel, procentuell förändring eller kvot?','Hämta bara de tal du behöver. Kontrollera att du inte blandar tusental och enskilda enheter.','Gör en överslagskontroll. En axel som inte börjar på noll kan förstora den visuella skillnaden.'],example:['En tabell visar resenärer: A = 120, B = 180, C = 300. Hur stor andel reste från B?',['Nämnaren är alla resenärer: 120 + 180 + 300 = 600.','Täljaren är resenärerna från B: 180.','Andel = 180/600 = 0,30 = 30 %. Att jämföra 180 bara med 300 hade besvarat en annan fråga.']],trap:'”Hur många fler?” efterfrågar differens. ”Hur många procent fler?” kräver att differensen delas med jämförelsevärdet. ”Andel av samtliga” kräver totalsumman.',checks:[['Ett värde stiger från 50 till 60. Procentuell ökning?',['10 %','20 %','16,7 %','60 %'],1,'Ökningen är 10. Basen är det gamla värdet 50: 10/50 = 20 %.'],['En andel ökar från 40 % till 50 %. Ökning i procentenheter?',['10','20','25','90'],0,'50 − 40 = 10 procentenheter. Den relativa procentökningen hade varit 10/40 = 25 %.']]},
{goal:'Lära sig ordens betydelse aktivt och skilja närliggande ord åt.',steps:['Försök förklara ordet innan du öppnar svaret. Markera vad du faktiskt inte kan.','Läs betydelsen och skriv en enkel mening där ordet passar.','Jämför med ett närliggande ord: vad är likt och vad skiljer dem åt?','Försök återkalla betydelsen igen efter en paus. Återvänd till orden du inte kunde förklara.'],example:['Skilj ”skeptisk” från ”cynisk”.',['Skeptisk: tvivlande eller kritiskt prövande. ”Hon var skeptisk till bevisningen och ville se fler data.”','Cynisk: kan beskriva en misstro mot människors motiv eller en hänsynslös inställning. Orden är inte utbytbara i alla sammanhang.','Ett bra ordkort innehåller betydelse, egen mening och en kontrast. Ren igenkänning kan ge en falsk känsla av säkerhet.']],trap:'Orddelar kan ge ledtrådar men bevisar inte betydelsen. Ett ord som liknar ett engelskt ord behöver inte betyda samma sak.',checks:[['Vad betyder ”konsekvent” i ”Hon tillämpade regeln konsekvent”?',['På ett enhetligt sätt','Motvilligt','Utan att tänka','Bara ibland'],0,'Här betyder det att regeln tillämpas likartat från gång till gång.'],['Vilken aktivitet testar bäst om du kan ett ord?',['Titta på ordet och betydelsen samtidigt','Förklara ordet utan att se betydelsen','Läsa samma lista snabbare','Räkna hur många bokstäver ordet har'],1,'Återkallning utan svaret synligt prövar din kunskap. Att känna igen ett ord är lättare än att kunna förklara det.']]},
{goal:'Hitta stöd för huvudtanke, slutsats och författarhållning utan att läsa in mer än texten säger.',steps:['Läs frågan exakt: söker den huvudpoäng, detalj, slutsats eller syfte med ett exempel?','Sammanfatta textens argument med en egen mening. Skilj på författarens röst och citerade personers åsikter.','Lokalisera stödet. En slutsats får vara indirekt, men måste följa rimligt av det som står.','Pröva alla alternativ mot texten. Avfärda svar som är för absoluta, för breda eller bygger på utomstående kunskap.'],example:['Text: ”Nya parker kan stärka trivseln. Effekten beror dock på underhåll och tillgänglighet.” Vad är huvudpoängen?',['Första meningen ger en möjlig fördel. Den andra sätter ett villkor för hur fördelen uppstår.','En trogen sammanfattning är: parker kan hjälpa, men utformning och skötsel spelar roll.','”Parker förbättrar alltid trivseln” går längre än texten. ”Parker har ingen betydelse” ignorerar första meningen.']],trap:'Ett svar kan vara sant i verkligheten men ändå sakna stöd i texten. Ord som ”alla”, ”aldrig” och ”enda” kräver starkare stöd än ”kan” och ”ibland”.',checks:[['”Metoden gav bättre resultat i två små studier. Författarna efterlyser större försök.” Vilken slutsats stöds?',['Metoden fungerar för alla','Resultaten är lovande men inte slutgiltiga','Studierna visade ingen förbättring','Större försök är onödiga'],1,'Förbättring finns i materialet, men författarna begränsar hur långt resultatet kan generaliseras.'],['”Biltrafiken minskade. Samtidigt öppnade en ny busslinje.” Vad kan man säkert säga?',['Busslinjen orsakade hela minskningen','Trafiken minskade och busslinjen öppnade under samma period','Busslinjen minskade antalet invånare','Ingen åkte med buss'],1,'Texten anger samtidighet, inte ett bevisat orsakssamband eller dess storlek.']]},
{goal:'Använda logiska samband, grammatik och ordens betydelser för att välja en komplett mening.',steps:['Läs hela meningen före alternativen. Bestäm vad resonemanget vill säga.','Identifiera sambandsord: ”eftersom” anger skäl, ”trots” motförväntan och ”därför” följd.','Gissa en ungefärlig betydelse för varje lucka utan att låsa dig vid ett visst ord.','Läs om hela meningen med alternativet. Vid flera luckor måste alla orden fungera tillsammans.'],example:['”Trots att rapporten var _____ var slutsatsen tydlig; författaren hade lyckats vara _____.”',['”Trots” antyder något som kan göra det svårare att nå en tydlig slutsats: exempelvis omfattande.','Andra luckan måste förklara hur tydligheten ändå uppnås: exempelvis stringent, alltså logiskt sammanhängande.','Pröva hela: ”Trots att rapporten var omfattande var slutsatsen tydlig; författaren hade lyckats vara stringent.” Sambandet håller i båda leden.']],trap:'En halvbra kombination räcker inte. Om första ordet fungerar men andra luckan blir logiskt fel ska hela alternativet bort.',checks:[['”Hon hade förberett sig väl; _____ kände hon sig osäker.” Vilket passar?',['därför','ändå','följaktligen','dessutom inte'],1,'”Ändå” visar att osäkerheten finns trots goda förberedelser. De andra följdorden skulle ge ett annat samband.'],['”Mätningarna var _____, vilket gjorde jämförelserna tillförlitliga.”',['inkonsekventa','enhetliga','slumpvis borttagna','motsägelsefulla'],1,'Enhetliga mätningar kan möjliggöra tillförlitliga jämförelser. De andra alternativen underminerar följden i meningen.']]},
{goal:'Följa ett engelskt resonemang och skilja vad texten säger från starkare påståenden.',steps:['Identifiera ämne, syfte och eventuell slutsats. Översätt inte varje ord om du redan förstår funktionen.','Följ sambandsord: however = dock, therefore = därför, although = fastän.','Var uppmärksam på begränsningar: may är svagare än will, some är svagare än all.','Sök stöd för ditt val och förklara på svenska varför de andra alternativen går längre än texten.'],example:['“The device may reduce energy use, provided that it is installed correctly.” Vilket påstående stöds?',['”May” uttrycker en möjlighet, inte en garanti.','”Provided that” betyder under förutsättning att. Korrekt installation är ett villkor.','Rimlig sammanfattning: apparaten kan minska energianvändningen om den installeras rätt. Texten garanterar inte en minskning i varje situation.']],trap:'Ett bekant ord kan ha annan betydelse i sammanhanget: ”eventually” betyder till slut, inte eventuellt. Läs hela meningen innan du drar en slutsats.',checks:[['“The result was unexpected; nevertheless, it was consistent with earlier findings.” Vad betyder nevertheless?',['Därför','Trots det','Till exempel','Innan dess'],1,'Nevertheless markerar en kontrast: resultatet var oväntat men stämde trots det med tidigare fynd.'],['“Some participants benefited from the change.” Vilket är en trogen återgivning?',['Alla gynnades','Ingen gynnades','Vissa gynnades','Förändringen garanterar framgång'],2,'Some innebär vissa. Meningen säger inte att alla eller ingen hade nytta av förändringen.']]},
{goal:'Välja mellan medelvärde, median och sannolikhet och kunna kontrollera enkla beräkningar.',steps:['Medelvärde: addera alla värden och dividera med antalet. Om medelvärdet och antalet är kända kan du räkna tillbaka summan.','Median: sortera först. Vid jämnt antal tar du medelvärdet av de två mittersta.','Sannolikhet: skriv upp de möjliga utfallen och kontrollera att de är lika sannolika.','Vid flera dragningar: tänk på om urvalet ändras. Utan återläggning ändras ofta sannolikheten vid nästa drag.'],example:['En påse har 3 röda och 2 blå kulor. Två kulor dras utan återläggning. Sannolikhet att båda är röda?',['Första kulan är röd med sannolikheten 3/5.','Efter en röd första kula finns 2 röda av totalt 4 kvar: sannolikheten för nästa röda är 2/4.','Båda röda: (3/5) × (2/4) = 6/20 = 3/10. Med återläggning hade nästa sannolikhet varit 3/5 i stället.']],trap:'Medelvärdet påverkas av extremvärden. Medianen kan beskriva en typisk nivå bättre, men det beror på vad frågan faktiskt ber om.',checks:[['Medianen av 12, 3, 8 och 5 är …',['5','6,5','7','8'],1,'Sortera: 3, 5, 8, 12. De två mittersta är 5 och 8: (5 + 8)/2 = 6,5.'],['Fem tal har medelvärdet 6. Ett sjätte tal, 12, läggs till. Nytt medelvärde?',['7','8','9','6'],0,'Ursprunglig summa är 5 × 6 = 30. Ny summa 42, nytt antal 6. Medelvärdet är 42/6 = 7.']]},
